# rtpv configuration file
# Generated by: rtpv gen-conf
# Location:     ~/.config/rtpv/rtpv.toml
#
# All options can also be set as environment variables (RTPV_* prefix).
# Environment variables take highest priority over this file.

# ── Store ────────────────────────────────────────────────────────────────────
# Path to your password store directory.
# Default: ~/.password-store
# Env: PASSWORD_STORE_DIR
#
# store_dir = "~/.password-store"

# ── Crypto backend ───────────────────────────────────────────────────────────
# "age"  — native age encryption via rage (recommended, no external deps)
# "gpg"  — subprocess GPG for pass-compatible stores
# Env: RTPV_BACKEND
#
# crypto_backend = "age"

# ── Age identity ─────────────────────────────────────────────────────────────
# Path to your age private key (X25519).
# Generated automatically on first run with: rtpv init
# Default: ~/.config/rtpv/identity.age
#
# age_identity = "~/.config/rtpv/identity.age"

# ── Git sync ─────────────────────────────────────────────────────────────────
# Automatically git push/pull on every change.
# Env: RTPV_AUTOSYNC
autosync = false

# ── Clipboard ────────────────────────────────────────────────────────────────
# Seconds before copied password is cleared from clipboard.
# Env: RTPV_CLIP_TIMEOUT
clip_timeout = 20

# ── Audit ────────────────────────────────────────────────────────────────────
# Passwords last changed more than this many days ago are flagged as aged.
# Env: RTPV_MAX_AGE
max_age_days = 180

# ── Notifications ─────────────────────────────────────────────────────────────
# Show desktop notifications for copy, sync, etc.
# Env: RTPV_NOTIFY
notify = true

# ── Theme ────────────────────────────────────────────────────────────────────
# UI color theme for CLI output and TUI.
# Options: catppuccin | nord | gruvbox | dracula | solarized
# Env: RTPV_THEME
theme = "catppuccin"

# ── Password generator defaults ───────────────────────────────────────────────
# Default length for generated passwords.
# Env: RTPV_GEN_LENGTH
gen_length = 32

# Character set for random passwords.
# Supports ranges: A-Z, a-z, 0-9, and literal special chars.
# Env: RTPV_GEN_CHARS
gen_chars = "A-Za-z0-9@#%+=_"

# ── Debug ────────────────────────────────────────────────────────────────────
# Write a trace log to ~/.cache/rtpv/log
# Env: RTPV_DEBUG
debug = false
