[package]
name        = "rtpv"
version     = "0.1.0"
edition     = "2021"
authors     = ["rtpv"]
license     = "MIT"
description = "rtpv — Rust Password Vault"
rust-version = "1.75"

[[bin]]
name = "rtpv"
path = "src/main.rs"

[dependencies]
# ── Crypto ───────────────────────────────────────────────────────
age         = { version = "0.10", features = ["armor"] }

# ── OTP ──────────────────────────────────────────────────────────
totp-rs     = { version = "5", features = ["gen_secret", "otpauth"] }

# ── CLI ──────────────────────────────────────────────────────────
clap        = { version = "4", features = ["derive", "env"] }

# ── TUI ──────────────────────────────────────────────────────────
ratatui     = "0.26"
crossterm   = { version = "0.27", features = ["event-stream"] }

# ── Serialization ────────────────────────────────────────────────
serde       = { version = "1", features = ["derive"] }
toml        = "0.8"
serde_json  = "1"

# ── Error handling ───────────────────────────────────────────────
anyhow      = "1"
thiserror   = "1"

# ── Password ─────────────────────────────────────────────────────
zxcvbn      = "2"
rand        = "0.8"

# ── Clipboard ────────────────────────────────────────────────────
arboard     = "3"

# ── HTTP (HIBP) ──────────────────────────────────────────────────
ureq        = "2"
sha1        = { version = "0.10", features = ["std"] }

# ── Fuzzy match ──────────────────────────────────────────────────
fuzzy-matcher = "0.3"

# ── Misc ─────────────────────────────────────────────────────────
chrono      = { version = "0.4", features = ["serde"] }
directories = "5"
walkdir     = "2"
tempfile    = "3"
base64      = "0.21"
urlencoding = "2"

base32 = "0.4"
url = "2"
rpassword   = "7"
dirs        = "5"
git2        = { version = "0.18", default-features = false, features = ["ssh", "ssh_key_from_memory"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
panic         = "abort"

# ── Additional ────────────────────────────────────────────────────
